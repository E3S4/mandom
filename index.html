<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mandom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<div class="container">

    <h1>MANDOM</h1>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
